<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Focus Timer & Tasks</title>
    <style>
        body { font-family: system-ui, sans-serif; background: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .container { background: #1e293b; padding: 2rem; border-radius: 16px; width: 90%; max-width: 400px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); text-align: center; }
        h1 { font-size: 1.5rem; margin-bottom: 1rem; color: #38bdf8; }
        .timer { font-size: 4rem; font-weight: bold; margin: 1rem 0; font-variant-numeric: tabular-nums; }
        .buttons { display: flex; gap: 0.5rem; justify-content: center; margin-bottom: 1.5rem; }
        button { background: #38bdf8; color: #0f172a; border: none; padding: 0.6rem 1.2rem; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        button:hover { background: #7dd3fc; }
        button.secondary { background: #334155; color: #f8fafc; }
        button.secondary:hover { background: #475569; }
        .todo-input { display: flex; gap: 0.5rem; margin-bottom: 1rem; }
        input { flex: 1; padding: 0.6rem; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: white; }
        ul { list-style: none; padding: 0; text-align: left; }
        li { background: #0f172a; padding: 0.6rem 0.8rem; border-radius: 8px; margin-bottom: 0.5rem; display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
        li.done { text-decoration: line-through; opacity: 0.5; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Focus Timer</h1>
        <div class="timer" id="display">25:00</div>
        <div class="buttons">
            <button onclick="startTimer()">Start</button>
            <button class="secondary" onclick="pauseTimer()">Pause</button>
            <button class="secondary" onclick="resetTimer()">Reset</button>
        </div>
        <div class="todo-input">
            <input type="text" id="taskInput" placeholder="Add a new task...">
            <button onclick="addTask()">+</button>
        </div>
        <ul id="taskList"></ul>
    </div>

    <script>
        let time = 25 * 60;
        let interval = null;

        function updateDisplay() {
            const mins = Math.floor(time / 60).toString().padStart(2, '0');
            const secs = (time % 60).toString().padStart(2, '0');
            document.getElementById('display').textContent = `${mins}:${secs}`;
        }

        function startTimer() {
            if (interval) return;
            interval = setInterval(() => {
                if (time > 0) {
                    time--;
                    updateDisplay();
                } else {
                    clearInterval(interval);
                    interval = null;
                    alert("Time is up! Take a short break.");
                }
            }, 1000);
        }

        function pauseTimer() { clearInterval(interval); interval = null; }
        function resetTimer() { pauseTimer(); time = 25 * 60; updateDisplay(); }

        function addTask() {
            const input = document.getElementById('taskInput');
            if (!input.value.trim()) return;
            const li = document.createElement('li');
            li.textContent = input.value;
            li.onclick = () => li.classList.toggle('done');
            document.getElementById('taskList').appendChild(li);
            input.value = '';
        }
    </script>
</body>
</html>
