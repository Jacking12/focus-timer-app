<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FocusFlow AI — Open-Source Deep Work Suite</title>
    <style>
        :root {
            --bg: radial-gradient(circle at 15% 15%, #1e1b4b, #0f172a 55%, #020617);
            --card: rgba(30, 41, 59, 0.72);
            --primary: #38bdf8;
            --accent: #a855f7;
            --text: #f8fafc;
            --muted: #94a3b8;
            --border: rgba(255, 255, 255, 0.12);
            --surface: rgba(15, 23, 42, 0.7);
        }
        body.light {
            --bg: radial-gradient(circle at 15% 15%, #dbeafe, #f8fafc 60%, #e2e8f0);
            --card: rgba(255, 255, 255, 0.88);
            --primary: #0284c7;
            --accent: #7e22ce;
            --text: #0f172a;
            --muted: #475569;
            --border: rgba(15, 23, 42, 0.12);
            --surface: rgba(241, 245, 249, 0.9);
        }
        * { box-sizing: border-box; }
        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 1rem;
            transition: all 0.35s ease;
        }
        .app-shell {
            background: var(--card);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 1.8rem;
            border-radius: 26px;
            width: 100%;
            max-width: 520px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.5);
            border: 1px solid var(--border);
        }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.2rem; }
        .logo {
            font-weight: 800;
            font-size: 1.25rem;
            background: linear-gradient(90deg, var(--primary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .toolbar { display: flex; gap: 0.4rem; align-items: center; }
        .tool-btn, select.sound-select {
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text);
            border-radius: 10px;
            padding: 0.4rem 0.65rem;
            font-size: 0.82rem;
            cursor: pointer;
            outline: none;
        }
        .stats-bar { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.5rem; margin-bottom: 1rem; }
        .stat-box { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 0.6rem; text-align: center; }
        .stat-val { font-size: 1.1rem; font-weight: 800; color: var(--primary); }
        .stat-lbl { font-size: 0.72rem; color: var(--muted); text-transform: uppercase; }
        .goal-track { width: 100%; height: 6px; background: var(--surface); border-radius: 99px; overflow: hidden; margin-bottom: 1.2rem; border: 1px solid var(--border); }
        .goal-fill { height: 100%; width: 0%; background: linear-gradient(90deg, var(--primary), var(--accent)); transition: width 0.5s ease; }
        .modes { display: flex; gap: 0.35rem; background: var(--surface); padding: 0.35rem; border-radius: 14px; margin-bottom: 1.4rem; border: 1px solid var(--border); }
        .mode-btn { flex: 1; background: transparent; color: var(--muted); border: none; padding: 0.5rem; border-radius: 10px; font-size: 0.83rem; font-weight: 600; cursor: pointer; }
        .mode-btn.active { background: linear-gradient(135deg, var(--primary), var(--accent)); color: #fff; }
        .ring-area { position: relative; width: 210px; height: 210px; margin: 0 auto 1.3rem; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        svg.ring { position: absolute; top: 0; left: 0; transform: rotate(-90deg); }
        .ring-bg { stroke: var(--border); fill: transparent; }
        .ring-fg { stroke: url(#aiGrad); fill: transparent; stroke-linecap: round; transition: stroke-dashoffset 0.5s linear; }
        .time-display { font-size: 3.3rem; font-weight: 800; font-variant-numeric: tabular-nums; }
        .active-task-label { font-size: 0.78rem; color: var(--muted); max-width: 150px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 0.2rem; }
        .controls { display: flex; gap: 0.6rem; justify-content: center; margin-bottom: 1.4rem; }
        .btn-main { background: linear-gradient(135deg, var(--primary), var(--accent)); color: #fff; border: none; padding: 0.75rem 1.7rem; border-radius: 12px; font-weight: 700; font-size: 0.95rem; cursor: pointer; }
        .btn-sec { background: var(--surface); color: var(--text); border: 1px solid var(--border); padding: 0.75rem 1.1rem; border-radius: 12px; font-weight: 600; cursor: pointer; }
        .ai-banner { background: linear-gradient(135deg, rgba(56, 189, 248, 0.12), rgba(168, 85, 247, 0.14)); border: 1px solid rgba(168, 85, 247, 0.32); border-radius: 14px; padding: 0.75rem 0.95rem; margin-bottom: 1.1rem; font-size: 0.83rem; display: flex; align-items: center; gap: 0.6rem; }
        body.zen .zen-hide { display: none; }
        .input-row { display: flex; gap: 0.4rem; margin-bottom: 0.85rem; }
        input[type="text"] { flex: 1; padding: 0.72rem 0.9rem; border-radius: 12px; border: 1px solid var(--border); background: var(--surface); color: var(--text); outline: none; font-size: 0.88rem; }
        .btn-ai { background: linear-gradient(135deg, #a855f7, #ec4899); color: #fff; border: none; border-radius: 12px; padding: 0 0.85rem; font-weight: 700; font-size: 0.8rem; cursor: pointer; }
        ul.tasks { list-style: none; padding: 0; margin: 0; max-height: 190px; overflow-y: auto; }
        li.task-item { background: var(--surface); padding: 0.65rem 0.85rem; border-radius: 12px; margin-bottom: 0.45rem; display: flex; justify-content: space-between; align-items: center; border: 1px solid var(--border); font-size: 0.88rem; gap: 0.5rem; }
        li.task-item.pinned { border-color: var(--primary); }
        li.task-item.done span.txt { text-decoration: line-through; opacity: 0.5; }
        .task-actions { display: flex; gap: 0.35rem; }
        .mini-btn { background: transparent; border: none; color: var(--muted); cursor: pointer; font-size: 0.85rem; padding: 0.15rem 0.3rem; }
        .footer-bar { display: flex; justify-content: space-between; align-items: center; margin-top: 1rem; padding-top: 0.8rem; border-top: 1px solid var(--border); font-size: 0.75rem; color: var(--muted); }
    </style>
</head>

<body>
    <div class="app-shell">
        <div class="header">
            <div class="logo">✨ FocusFlow AI v4.0</div>
            <div class="toolbar">
                <select class="sound-select" onchange="changeSound(this.value)">
                    <option value="off">🔇 Sound Off</option>
                    <option value="brown">🎧 Deep Brown</option>
                    <option value="pink">🌧️ Soft Rain</option>
                </select>
                <button class="tool-btn" onclick="document.body.classList.toggle('zen')" title="Zen Mode">⛶</button>
                <button class="tool-btn" onclick="document.body.classList.toggle('light')" title="Theme">🌓</button>
            </div>
        </div>
        <div class="stats-bar zen-hide">
            <div class="stat-box"><div class="stat-val" id="statSessions">0</div><div class="stat-lbl">Sessions</div></div>
            <div class="stat-box"><div class="stat-val" id="statMinutes">0m</div><div class="stat-lbl">Deep Work</div></div>
            <div class="stat-box"><div class="stat-val" id="statTasks">0/0</div><div class="stat-lbl">Completed</div></div>
        </div>
        <div class="goal-track zen-hide"><div class="goal-fill" id="goalFill"></div></div>
        <div class="modes">
            <button class="mode-btn active" onclick="setMode(25, this)">Deep Focus (25m)</button>
            <button class="mode-btn" onclick="setMode(5, this)">Short Break (5m)</button>
            <button class="mode-btn" onclick="setMode(15, this)">Long Break (15m)</button>
        </div>
        <div class="ring-area">
            <svg class="ring" width="210" height="210">
                <defs><linearGradient id="aiGrad" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#38bdf8" /><stop offset="100%" stop-color="#a855f7" /></linearGradient></defs>
                <circle class="ring-bg" stroke-width="10" r="92" cx="105" cy="105" />
                <circle class="ring-fg" id="ringFg" stroke-width="10" r="92" cx="105" cy="105" />
            </svg>
            <div class="time-display" id="display">25:00</div>
            <div class="active-task-label" id="pinnedLabel">No active task pinned</div>
        </div>
        <div class="controls">
            <button class="btn-main" id="startBtn" onclick="toggleTimer()">▶ Start Focus</button>
            <button class="btn-sec" onclick="resetTimer()">↺ Reset</button>
        </div>
        <div class="ai-banner zen-hide">
            <span>🤖</span>
            <span id="coachMsg"><strong>AI Coach:</strong> Press <b>Space</b> to start/pause, or type a goal and hit <b>✨ AI Split</b>.</span>
        </div>
        <div class="input-row zen-hide">
            <input type="text" id="taskInput" placeholder="Add a goal or task..." onkeypress="if(event.key==='Enter') addTask()">
            <button class="btn-sec" onclick="addTask()" style="padding:0 0.9rem;">+</button>
            <button class="btn-ai" onclick="aiSplit()">✨ AI Split</button>
        </div>
        <ul class="tasks zen-hide" id="taskList"></ul>
        <div class="footer-bar zen-hide">
            <span>Shortcut: <strong>Space</strong> = Start/Pause</span>
            <button class="tool-btn" onclick="exportMarkdown()">📥 Export .md</button>
        </div>
    </div>
    <script>
        let totalSecs = 1500, time = 1500, currentMins = 25, timerId = null, pinnedIdx = -1, audioCtx = null;
        let sessions = parseInt(localStorage.getItem('ff4_sessions') || '0');
        let focusMins = parseInt(localStorage.getItem('ff4_mins') || '0');
        let tasks = JSON.parse(localStorage.getItem('ff4_tasks') || '[]');
        const ring = document.getElementById('ringFg'), circ = 2 * Math.PI * 92;
        ring.style.strokeDasharray = `${circ} ${circ}`;

        function updateUI() {
            const m = Math.floor(time / 60).toString().padStart(2, '0'), s = (time % 60).toString().padStart(2, '0');
            document.getElementById('display').textContent = `${m}:${s}`;
            document.title = `${m}:${s} — FocusFlow AI`;
            ring.style.strokeDashoffset = circ - ((time / totalSecs) * circ);
            document.getElementById('statSessions').textContent = sessions;
            document.getElementById('statMinutes').textContent = `${focusMins}m`;
            document.getElementById('statTasks').textContent = `${tasks.filter(t => t.done).length}/${tasks.length}`;
            document.getElementById('goalFill').style.width = `${Math.min(100, (sessions / 4) * 100)}%`;
            document.getElementById('pinnedLabel').textContent = (pinnedIdx >= 0 && tasks[pinnedIdx]) ? `📌 ${tasks[pinnedIdx].text}` : 'No active task pinned';
        }
        function setMode(mins, btn) {
            stopTimer(); currentMins = mins; totalSecs = mins * 60; time = totalSecs;
            document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active'); updateUI();
            coach(mins === 25 ? "Deep Focus mode armed. Pin a task with 📌." : "Break mode active. Rest your eyes.");
        }
        function toggleTimer() {
            if (timerId) { stopTimer(); coach("Session paused."); return; }
            document.getElementById('startBtn').textContent = "⏸ Pause";
            coach("Focus timer running. Stay in flow!");
            timerId = setInterval(() => {
                if (time > 0) { time--; updateUI(); }
                else {
                    stopTimer(); chime();
                    if (currentMins === 25) {
                        sessions++; focusMins += 25;
                        localStorage.setItem('ff4_sessions', sessions); localStorage.setItem('ff4_mins', focusMins);
                        coach(`🎉 Session #${sessions} complete!`);
                    } else coach("Break finished!");
                    updateUI();
                }
            }, 1000);
        }
        function stopTimer() { clearInterval(timerId); timerId = null; document.getElementById('startBtn').textContent = "▶ Start Focus"; }
        function resetTimer() { stopTimer(); time = totalSecs; updateUI(); }
        function chime() {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => {
                const o = ctx.createOscillator(), g = ctx.createGain();
                o.type = 'triangle'; o.frequency.setValueAtTime(f, ctx.currentTime + i * 0.12);
                g.gain.setValueAtTime(0.14, ctx.currentTime + i * 0.12); g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + i * 0.12 + 0.45);
                o.connect(g); g.connect(ctx.destination); o.start(ctx.currentTime + i * 0.12); o.stop(ctx.currentTime + i * 0.12 + 0.45);
            });
        }
        function changeSound(type) {
            if (audioCtx) { audioCtx.close(); audioCtx = null; }
            if (type === 'off') { coach("Ambient sound off."); return; }
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const size = 2 * audioCtx.sampleRate, buf = audioCtx.createBuffer(1, size, audioCtx.sampleRate), data = buf.getChannelData(0);
            let last = 0, b0=0, b1=0, b2=0;
            for (let i = 0; i < size; i++) {
                const w = Math.random() * 2 - 1;
                if (type === 'brown') { data[i] = (last + 0.02 * w) / 1.02; last = data[i]; data[i] *= 0.18; }
                else { b0 = 0.99765*b0 + w*0.099046; b1 = 0.963*b1 + w*0.2965164; b2 = 0.57*b2 + w*1.0526913; data[i] = (b0+b1+b2+w*0.1848)*0.04; }
            }
            const src = audioCtx.createBufferSource(); src.buffer = buf; src.loop = true; src.connect(audioCtx.destination); src.start(0);
            coach(type === 'brown' ? "🎧 Deep Brown Noise active." : "🌧️ Soft Rain soundscape active.");
        }
        function coach(html) { document.getElementById('coachMsg').innerHTML = `<strong>AI Coach:</strong> ${html}`; }
        function aiSplit() {
            const inp = document.getElementById('taskInput'), val = inp.value.trim();
            if (!val) { coach("Type a task first, then click <b>✨ AI Split</b>!"); return; }
            [`[10m] Plan & setup: ${val}`, `[25m] Core deep-work sprint: ${val}`, `[10m] Review & finalize: ${val}`].forEach(p => tasks.push({ text: p, done: false }));
            inp.value = ''; saveTasks(); coach(`✨ AI broke "<b>${val}</b>" into 3 micro-tasks!`);
        }
        function saveTasks() {
            localStorage.setItem('ff4_tasks', JSON.stringify(tasks));
            const ul = document.getElementById('taskList'); ul.innerHTML = '';
            tasks.forEach((t, i) => {
                const li = document.createElement('li');
                li.className = `task-item ${t.done ? 'done' : ''} ${i === pinnedIdx ? 'pinned' : ''}`;
                li.innerHTML = `<span class="txt" onclick="tasks[${i}].done=!tasks[${i}].done;saveTasks();" style="cursor:pointer;flex:1;">${t.text}</span><div class="task-actions"><button class="mini-btn" onclick="pinnedIdx=(pinnedIdx===${i}?-1:${i});saveTasks();">📌</button><button class="mini-btn" onclick="if(pinnedIdx===${i})pinnedIdx=-1;tasks.splice(${i},1);saveTasks();" style="color:#ef4444;">✕</button></div>`;
                ul.appendChild(li);
            });
            updateUI();
        }
        function addTask() { const inp = document.getElementById('taskInput'); if (!inp.value.trim()) return; tasks.push({ text: inp.value.trim(), done: false }); inp.value = ''; saveTasks(); }
        function exportMarkdown() {
            const date = new Date().toISOString().split('T')[0];
            let md = `# FocusFlow AI Summary (${date})\n- Sessions: ${sessions}\n- Deep Work: ${focusMins}m\n\n## Tasks\n` + tasks.map(t => `- [${t.done?'x':' '}] ${t.text}`).join('\n');
            const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([md], { type: 'text/markdown' })); a.download = `focusflow-${date}.md`; a.click();
