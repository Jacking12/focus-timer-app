<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FocusFlow AI — Open-Source Deep Work Suite</title>
    <style>
        :root {
            --bg: radial-gradient(circle at 15% 15%, #1e1b4b, #0f172a 55%, #020617);
            --card: rgba(30, 41, 59, 0.72);
            --primary: #38bdf8;
            --accent: #a855f7;
            --success: #10b981;
            --text: #f8fafc;
            --muted: #94a3b8;
            --border: rgba(255, 255, 255, 0.12);
            --surface: rgba(15, 23, 42, 0.7);
        }
        body.light {
            --bg: radial-gradient(circle at 15% 15%, #dbeafe, #f8fafc 60%, #e2e8f0);
            --card: rgba(255, 255, 255, 0.88);
            --primary: #0284c7;
            --accent: #7e22ce;
            --success: #059669;
            --text: #0f172a;
            --muted: #475569;
            --border: rgba(15, 23, 42, 0.12);
            --surface: rgba(241, 245, 249, 0.9);
        }
        * { box-sizing: border-box; }
        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 1rem;
            transition: all 0.35s ease;
        }
        .app-shell {
            background: var(--card);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 1.8rem;
            border-radius: 26px;
            width: 100%;
            max-width: 520px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.5);
            border: 1px solid var(--border);
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.2rem;
        }
        .logo {
            font-weight: 800;
            font-size: 1.25rem;
            display: flex;
            align-items: center;
            gap: 0.45rem;
            background: linear-gradient(90deg, var(--primary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .toolbar { display: flex; gap: 0.4rem; align-items: center; }
        .tool-btn, select.sound-select {
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text);
            border-radius: 10px;
            padding: 0.4rem 0.65rem;
            font-size: 0.82rem;
            cursor: pointer;
            outline: none;
        }
        .stats-bar {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0.5rem;
            margin-bottom: 1.2rem;
        }
        .stat-box {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 0.6rem;
            text-align: center;
        }
        .stat-val { font-size: 1.1rem; font-weight: 800; color: var(--primary); }
        .stat-lbl { font-size: 0.72rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; }
        .goal-track {
            width: 100%;
            height: 6px;
            background: var(--surface);
            border-radius: 99px;
            overflow: hidden;
            margin-bottom: 1.2rem;
            border: 1px solid var(--border);
        }
        .goal-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--primary), var(--accent));
            transition: width 0.5s ease;
        }
        .modes {
            display: flex;
            gap: 0.35rem;
            background: var(--surface);
            padding: 0.35rem;
            border-radius: 14px;
            margin-bottom: 1.4rem;
            border: 1px solid var(--border);
        }
        .mode-btn {
            flex: 1;
            background: transparent;
            color: var(--muted);
            border: none;
            padding: 0.5rem;
            border-radius: 10px;
            font-size: 0.83rem;
            font-weight: 600;
            cursor: pointer;
        }
        .mode-btn.active {
            background: linear-gradient(135deg, var(--primary), var(--accent));
            color: #fff;
            box-shadow: 0 4px 12px rgba(56, 189, 248, 0.25);
        }
        .ring-area {
            position: relative;
            width: 210px;
            height: 210px;
            margin: 0 auto 1.3rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        svg.ring { position: absolute; top: 0; left: 0; transform: rotate(-90deg); }
        .ring-bg { stroke: var(--border); fill: transparent; }
        .ring-fg { stroke: url(#aiGrad); fill: transparent; stroke-linecap: round; transition: stroke-dashoffset 0.5s linear; }
        .time-display { font-size: 3.3rem; font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: -1px; }
        .active-task-label { font-size: 0.78rem; color: var(--muted); max-width: 150px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 0.2rem; }
        .controls { display: flex; gap: 0.6rem; justify-content: center; margin-bottom: 1.4rem; }
        .btn-main {
            background: linear-gradient(135deg, var(--primary), var(--accent));
            color: #fff;
            border: none;
            padding: 0.75rem 1.7rem;
            border-radius: 12px;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(168, 85, 247, 0.3);
        }
        .btn-sec {
            background: var(--surface);
            color: var(--text);
            border: 1px solid var(--border);
            padding: 0.75rem 1.1rem;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
        }
        .ai-banner {
            background: linear-gradient(135deg, rgba(56, 189, 248, 0.12), rgba(168, 85, 247, 0.14));
            border: 1px solid rgba(168, 85, 247, 0.32);
            border-radius: 14px;
            padding: 0.75rem 0.95rem;
            margin-bottom: 1.1rem;
            font-size: 0.83rem;
            display: flex;
            align-items: center;
            gap: 0.6rem;
            line-height: 1.4;
        }
        .zen-hide { transition: opacity 0.3s ease; }
        body.zen .zen-hide { display: none; }
        .input-row { display: flex; gap: 0.4rem; margin-bottom: 0.85rem; }
        input[type="text"] {
            flex: 1;
            padding: 0.72rem 0.9rem;
            border-radius: 12px;
            border: 1px solid var(--border);
            background: var(--surface);
            color: var(--text);
            outline: none;
            font-size: 0.88rem;
        }
        .btn-ai {
            background: linear-gradient(135deg, #a855f7, #ec4899);
            color: #fff;
            border: none;
            border-radius: 12px;
            padding: 0 0.85rem;
            font-weight: 700;
            font-size: 0.8rem;
            cursor: pointer;
            white-space: nowrap;
        }
        ul.tasks { list-style: none; padding: 0; margin: 0; max-height: 190px; overflow-y: auto; }
        li.task-item {
            background: var(--surface);
            padding: 0.65rem 0.85rem;
            border-radius: 12px;
            margin-bottom: 0.45rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid var(--border);
            font-size: 0.88rem;
            gap: 0.5rem;
        }
        li.task-item.pinned { border-color: var(--primary); }
        li.task-item.done span.txt { text-decoration: line-through; opacity: 0.5; }
        .task-actions { display: flex; gap: 0.35rem; }
        .mini-btn { background: transparent; border: none; color: var(--muted); cursor: pointer; font-size: 0.85rem; padding: 0.15rem 0.3rem; }
        .mini-btn:hover { color: var(--primary); }
        .footer-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 1rem;
            padding-top: 0.8rem;
            border-top: 1px solid var(--border);
            font-size: 0.75rem;
            color: var(--muted);
        }
    </style>
</head>
<body>
    <div class="app-shell">
        <div class="header">
            <div class="logo">✨ FocusFlow AI <span style="font-size:0.7rem;opacity:0.7;">v4.0</span></div>
            <div class="toolbar">
                <select class="sound-select" id="soundSelect" onchange="changeSound(this.value)" title="AI Soundscape">
                    <option value="off">🔇 Sound Off</option>
                    <option value="brown">🎧 Deep Brown</option>
                    <option value="pink">🌧️ Soft Rain</option>
                </select>
                <button class="tool-btn" onclick="toggleZen()" title="Zen Focus Mode">⛶</button>
                <button class="tool-btn" onclick="toggleTheme()" title="Light/Dark Mode">🌓</button>
            </div>
        </div>

        <div class="stats-bar zen-hide">
            <div class="stat-box">
                <div class="stat-val" id="statSessions">0</div>
                <div class="stat-lbl">Sessions</div>
            </div>
            <div class="stat-box">
                <div class="stat-val" id="statMinutes">0m</div>
                <div class="stat-lbl">Deep Work</div>
            </div>
            <div class="stat-box">
                <div class="stat-val" id="statTasks">0/0</div>
                <div class="stat-lbl">Completed</div>
            </div>
        </div>
